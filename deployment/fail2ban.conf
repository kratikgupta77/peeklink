# Fail2Ban configuration for PeekLink
# Install: sudo apt-get install fail2ban
# Place in /etc/fail2ban/jail.d/peeklink.conf

[peeklink-nginx-limit-req]
enabled = true
port = http,https
filter = peeklink-nginx-limit-req
logpath = /var/log/nginx/peeklink_error.log
maxretry = 10
findtime = 600
bantime = 3600
action = iptables-multiport[name=peeklink, port="http,https", protocol=tcp]

[peeklink-auth]
enabled = true
port = http,https
filter = peeklink-auth
logpath = /var/log/nginx/peeklink_access.log
maxretry = 5
findtime = 300
bantime = 7200
action = iptables-multiport[name=peeklink-auth, port="http,https", protocol=tcp]

