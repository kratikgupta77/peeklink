# Nginx SSL configuration (use after setting up Let's Encrypt)
# This is an example - certbot will modify nginx.conf automatically

server {
    listen 443 ssl http2;
    server_name 192.168.2.236;
    
    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Include the rest of the configuration from nginx.conf
    # (copy all location blocks from nginx.conf here)
}

