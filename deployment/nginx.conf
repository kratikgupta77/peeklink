# Nginx configuration for PeekLink
# Place this in /etc/nginx/sites-available/peeklink
# Then symlink: sudo ln -s /etc/nginx/sites-available/peeklink /etc/nginx/sites-enabled/

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=score_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Connection limiting (prevent too many connections from same IP)
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream django_backend {
    server 127.0.0.1:8000;
    # Add more servers for load balancing if needed
    # server 127.0.0.1:8001;
}

upstream fastapi_verdicts {
    server 127.0.0.1:9000;
    # Add more servers for load balancing if needed
    # server 127.0.0.1:9001;
}

upstream react_dashboard {
    server 127.0.0.1:5173;
}

# HTTP server (redirect to HTTPS if SSL is configured)
server {
    listen 80;
    server_name 192.168.2.236;
    
    # Uncomment to redirect to HTTPS
    # return 301 https://$server_name$request_uri;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Logging
    access_log /var/log/nginx/peeklink_access.log;
    error_log /var/log/nginx/peeklink_error.log;
    
    # Max body size (for file uploads if needed)
    client_max_body_size 10M;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Connection limiting
    limit_conn conn_limit 20;
    
    # Django API endpoints with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
    
    # Authentication endpoints - stricter rate limiting
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
    
    # Public link endpoints (preview and redirect)
    location ~ ^/(p|r)/ {
        limit_req zone=general_limit burst=50 nodelay;
        limit_req_status 429;
        
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
    
    # FastAPI Verdicts service
    location /score {
        limit_req zone=score_limit burst=30 nodelay;
        limit_req_status 429;
        
        proxy_pass http://fastapi_verdicts;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
    
    # React Dashboard (Vite dev server or built files)
    location / {
        limit_req zone=general_limit burst=100 nodelay;
        
        proxy_pass http://react_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }
    
    # Static files (if serving Django static files)
    location /static/ {
        alias /var/www/peeklink/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Media files (if any)
    location /media/ {
        alias /var/www/peeklink/media/;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Health check endpoint (no rate limiting)
    location /health {
        access_log off;
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Rate limiting for specific IPs (if needed to block)
