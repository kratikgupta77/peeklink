# ========================================
# PeekLink NGINX CONFIG (HTTPS + Vite Preview)
# ========================================

# -----------------------
# Rate limiting zones
# -----------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=score_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# -----------------------
# Upstreams
# -----------------------
upstream django_backend {
    server 127.0.0.1:8000;
}

upstream fastapi_verdicts {
    server 127.0.0.1:9000;
}

upstream react_dashboard {
    server 127.0.0.1:5173;
}

# -----------------------
# HTTP → HTTPS Redirect
# -----------------------
server {
    listen 80;
    server_name 192.168.2.236;

    return 301 https://$host$request_uri;
}

# -----------------------
# HTTPS SERVER BLOCK
# -----------------------
server {
    listen 443 ssl;
    server_name 192.168.2.236;

    # Self-signed certificate paths
    ssl_certificate     /etc/ssl/certs/selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/selfsigned.key;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/peeklink_access.log;
    error_log  /var/log/nginx/peeklink_error.log;

    # Max body size
    client_max_body_size 10M;

    # Timeouts
    proxy_connect_timeout 60;
    proxy_send_timeout    60;
    proxy_read_timeout    60;

    limit_conn conn_limit 20;

    # -----------------------
    # Django API Endpoints
    # -----------------------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://django_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://django_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public redirect endpoints (p/, r/)
    location ~ ^/(p|r)/ {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://django_backend;
    }

    # -----------------------
    # FastAPI /score endpoint
    # -----------------------
    location /score {
        limit_req zone=score_limit burst=30 nodelay;
        proxy_pass http://fastapi_verdicts;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------
    # React Dashboard (Vite Preview)
    # -----------------------
    location / {
        proxy_pass http://react_dashboard;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }

    # Django static files (optional)
    location /static/ {
        alias /var/www/peeklink/static/;
        expires 30d;
    }

    # Django media files (optional)
    location /media/ {
        alias /var/www/peeklink/media/;
        expires 7d;
    }

    # Health check
    location /health {
        access_log off;
        proxy_pass http://django_backend;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }
}
