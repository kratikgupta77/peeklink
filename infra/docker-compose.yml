
version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: peeklink
      POSTGRES_USER: peeklink
      POSTGRES_PASSWORD: peeklink
    volumes: [ "pgdata:/var/lib/postgresql/data" ]

  redis:
    image: redis:7

  api:
    build: ../backend_drf
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: peeklink
      POSTGRES_USER: peeklink
      POSTGRES_PASSWORD: peeklink
    depends_on: [db]

  verdicts:
    build: ../verdicts

  dashboard:
    build: ../dashboard

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on: [api, verdicts, dashboard]

volumes:
  pgdata:
